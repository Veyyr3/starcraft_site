<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersport</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- здесь кнопки навигации -->
    <nav>
        <!-- логотип старкрафт (если нажать, то вернуться домой) -->
        <div class="logo">
            <a href="index.html">
                <img src="imgs/logo.png" alt="">
            </a>
        </div>

        <!-- кнопки на другие страницы -->
        <div class="buttons-container">
            <div class="button">
                <a href="starcraft1.html"><p>StarCraft I</p></a>
            </div>

            <div class="button">
                <a href="starcraft_brood_war.html"><p>StarCraft Brood War</p></a>
            </div>
                
            <div class="button">
                <a href="starcraft2.html"><p>StarCraft II</p></a>
            </div>

            <div class="button">
                <a href="starcraft.html"><p>StarCraft</p></a>
            </div>
        </div>
    </nav>

    <h1 style="text-align: center;">Заявка на турнир</h1>

    <div class="content">
        <!-- Форма на турнир -->
        <form id="tournamentForm">
            <div>
                <label for="fullname">ФИО:</label><br>
                <input type="text" id="fullname" placeholder="Иванов Иван Иванович">
                <span id="nameError" style="color: red;"></span>
            </div>
            <br>

            <div>
                <label for="phone">Номер телефона:</label><br>
                <input type="text" id="phone" placeholder="+79991234567">
                <span id="phoneError" style="color: red;"></span>
            </div>
            <br>

            <div>
                <label for="email">Электронная почта:</label><br>
                <input type="text" id="email" placeholder="example@mail.com">
                <span id="emailError" style="color: red;"></span>
            </div>

            <br>

            <div>
                <label>Выберите расу:</label><br>
                <label>
                    <input type="radio" name="race" value="Terran"> Терраны
                </label><br>
                <label>
                    <input type="radio" name="race" value="Zerg"> Зерги
                </label><br>
                <label>
                    <input type="radio" name="race" value="Protoss"> Протоссы
                </label><br>
                <label>
                    <input type="radio" name="race" value="Random"> Случайная (Random)
                </label><br>
                <span id="raceError" style="color: red;"></span>
            </div>

            <br>

            <button type="submit">Отправить заявку</button>
        </form>

        <!-- Сообщение об успешной отправке -->
        <h3 id="successMessage" style="color: green;"></h3>
    </div>

    <!-- JS -->
    <script src="js/cybersport.js"></script>
</body>
</html>
